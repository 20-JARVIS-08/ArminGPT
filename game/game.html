<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎱 Billiards</title>
    <style>
        :root {
            --gold: #f5c842;
            --text: #e8dcc8;
            --muted: rgba(232, 220, 200, 0.4);
            --red: #e63946;
            --green: #7df9a1;
            --bg: #0d0a06;
            --hud: rgba(8, 5, 2, 0.92);
            --border: rgba(255, 255, 255, 0.09);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        html,
        body {
            background: var(--bg);
            font-family: system-ui, sans-serif;
            color: var(--text);
            width: 100%;
            height: 100%;
            overflow: hidden;
            touch-action: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        #rotate-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: #0d0a06;
            z-index: 9999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        #rotate-overlay.show {
            display: flex
        }

        .r-icon {
            font-size: 72px;
            animation: rotA 2s ease-in-out infinite
        }

        @keyframes rotA {

            0%,
            25% {
                transform: rotate(0)
            }

            55%,
            80% {
                transform: rotate(90deg)
            }

            100% {
                transform: rotate(0)
            }
        }

        .r-title {
            font-size: 22px;
            font-weight: 800;
            color: var(--gold)
        }

        .r-sub {
            font-size: 14px;
            color: var(--muted);
            text-align: center;
            max-width: 260px;
            line-height: 1.5
        }

        #app {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100dvh;
        }

        #hud {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--hud);
            border-bottom: .5px solid var(--border);
            padding: 6px 14px;
            gap: 10px;
        }

        .hg {
            display: flex;
            gap: 16px;
            align-items: center
        }

        .stat {
            text-align: center
        }

        .sl {
            font-size: 8px;
            text-transform: uppercase;
            letter-spacing: .6px;
            color: var(--muted);
            line-height: 1
        }

        .sn {
            font-size: 18px;
            font-weight: 700;
            line-height: 1.2;
            color: var(--gold)
        }

        .sn.w {
            color: #f8f8f8
        }

        .sn.g {
            color: var(--green)
        }

        #logo {
            font-size: 14px;
            font-weight: 900;
            white-space: nowrap
        }

        #logo em {
            color: var(--gold);
            font-style: normal
        }

        #turn-ring {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, .2);
            transition: background .3s;
            flex-shrink: 0
        }

        #btn-restart-hud {
            background: rgba(255, 255, 255, .07);
            border: .5px solid var(--border);
            border-radius: 7px;
            color: var(--text);
            font-size: 12px;
            padding: 5px 10px;
            cursor: pointer;
            white-space: nowrap;
            transition: background .12s;
        }

        #btn-restart-hud:active {
            background: rgba(255, 255, 255, .22)
        }

        #table-wrap {
            flex: 1;
            min-height: 0;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            overflow: hidden;
        }

        #gc {
            display: block;
            touch-action: none;
        }

        #swipe-hint {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 10;
        }

        #swipe-hint-inner {
            background: rgba(0, 0, 0, .55);
            border: 1px solid rgba(255, 255, 255, .12);
            border-radius: 14px;
            padding: 12px 20px;
            text-align: center;
        }

        #swipe-hint-inner p {
            font-size: 13px;
            color: var(--muted);
            line-height: 1.6
        }

        #swipe-hint-inner .big {
            font-size: 28px;
            display: block;
            margin-bottom: 4px
        }

        #swipe-hint.gone {
            display: none
        }

        #pwr-mini {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 8px;
            height: 120px;
            border-radius: 4px;
            background: rgba(255, 255, 255, .08);
            border: .5px solid var(--border);
            overflow: hidden;
            display: none;
            z-index: 5;
            pointer-events: none;
        }

        #pwr-mini-fill {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(0deg, var(--red), var(--gold), var(--green));
            border-radius: 4px;
            transition: height .08s;
        }

        #pwr-mini-lbl {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 10px;
            font-weight: 700;
            color: var(--gold);
            display: none;
            z-index: 5;
            pointer-events: none;
            text-shadow: 0 1px 4px rgba(0, 0, 0, .8);
        }

        #msg-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            gap: 8px;
            z-index: 20;
        }

        #msg-main {
            font-size: clamp(18px, 5vw, 32px);
            font-weight: 900;
            color: var(--gold);
            text-shadow: 0 0 28px rgba(245, 200, 66, .7);
            opacity: 0;
            transition: opacity .2s;
            text-align: center;
            padding: 0 20px;
        }

        #msg-sub {
            font-size: clamp(12px, 3vw, 16px);
            color: var(--text);
            opacity: 0;
            transition: opacity .2s;
            text-align: center
        }

        #msg-main.show,
        #msg-sub.show {
            opacity: 1
        }

        #foul-badge {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--red);
            color: #fff;
            font-size: 12px;
            font-weight: 700;
            padding: 5px 16px;
            border-radius: 20px;
            opacity: 0;
            transition: opacity .3s;
            pointer-events: none;
            white-space: nowrap;
            z-index: 21;
        }

        #foul-badge.show {
            opacity: 1
        }

        /* ── bottom bar — desktop only ── */
        #bottom-bar {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--hud);
            border-top: .5px solid var(--border);
            padding: 7px 14px;
        }

        #pwr-label {
            font-size: 10px;
            color: var(--muted);
            white-space: nowrap
        }

        #pwr-track {
            flex: 1;
            height: 40px;
            position: relative;
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        #pwr-bar {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: rgba(255, 255, 255, .1);
            overflow: hidden
        }

        #pwr-fill {
            height: 100%;
            width: 50%;
            background: linear-gradient(90deg, var(--green), var(--gold), var(--red));
            border-radius: 3px
        }

        #pwr-knob {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--gold);
            border: 2px solid var(--bg);
            box-shadow: 0 0 8px rgba(245, 200, 66, .5);
            pointer-events: none;
        }

        #pwr-val {
            font-size: 12px;
            font-weight: 700;
            color: var(--gold);
            min-width: 32px;
            text-align: right
        }

        #btn-shoot {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: none;
            background: radial-gradient(circle at 40% 35%, #ffe066, #e0a800);
            color: #111;
            font-size: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 14px rgba(245, 200, 66, .4);
            transition: transform .1s;
        }

        #btn-shoot:active {
            transform: scale(.9)
        }

        #btn-shoot.off {
            opacity: .3;
            pointer-events: none
        }

        #btn-restart {
            background: rgba(255, 255, 255, .07);
            border: .5px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 12px;
            padding: 7px 12px;
            cursor: pointer;
            white-space: nowrap;
            transition: background .12s;
        }

        #btn-restart:active {
            background: rgba(255, 255, 255, .2)
        }

        /* ── responsive ──
           آستانه 1024px تا گوشی‌های بزرگ (Pro Max / Ultra) در landscape هم
           به عنوان موبایل شناخته بشن — معمولاً لپ‌تاپ‌ها از 1280px به بالا هستن */
        /* ── responsive ──
           1180px: بالاتر از بزرگ‌ترین گوشی‌ها در landscape (iPhone 14 Pro Max=932, S24 Ultra≈1000)
           و پایین‌تر از کوچک‌ترین لپ‌تاپ‌ها (معمولاً 1280px+) */
        @media(max-width:1180px) {
            #bottom-bar {
                display: none !important;
            }

            #pwr-mini {
                display: block
            }

            #pwr-mini-lbl {
                display: block
            }

            #hud {
                padding: 5px 10px
            }

            .sn {
                font-size: 16px
            }
        }

        @media(min-width:1181px) {
            #bottom-bar {
                display: flex
            }

            #pwr-mini {
                display: none
            }

            #pwr-mini-lbl {
                display: none
            }

            #swipe-hint {
                display: none
            }
        }
    </style>
</head>

<body>

    <div id="rotate-overlay">
        <span class="r-icon">📱</span>
        <div class="r-title">Rotate Your Phone</div>
        <div class="r-sub">Hold the phone horizontally to play</div>
    </div>

    <div id="app">
        <div id="hud">
            <div id="logo">🎱 <em>Billiards</em></div>
            <div id="turn-ring"></div>
            <div class="hg">
                <div class="stat">
                    <div class="sl">P1</div>
                    <div class="sn" id="p1s">0</div>
                </div>
                <div class="stat">
                    <div class="sl">P2</div>
                    <div class="sn w" id="p2s">0</div>
                </div>
            </div>
            <div class="hg">
                <div class="stat">
                    <div class="sl">Turn</div>
                    <div class="sn g" id="turn-lbl">P1</div>
                </div>
                <div class="stat">
                    <div class="sl">Left</div>
                    <div class="sn" id="balls-left">15</div>
                </div>
            </div>
            <button id="btn-restart-hud" onclick="initGame()">↺</button>
        </div>

        <div id="table-wrap">
            <canvas id="gc"></canvas>
            <div id="pwr-mini">
                <div id="pwr-mini-fill"></div>
            </div>
            <div id="pwr-mini-lbl">50%</div>
            <div id="msg-overlay">
                <div id="msg-main"></div>
                <div id="msg-sub"></div>
            </div>
            <div id="foul-badge">⚠ Scratch — Cue ball reset</div>
            <div id="swipe-hint">
                <div id="swipe-hint-inner">
                    <span class="big">👆</span>
                    <p>Swipe to aim & set power<br>Release to shoot</p>
                </div>
            </div>
        </div>

        <div id="bottom-bar">
            <span id="pwr-label">Power</span>
            <div id="pwr-track">
                <div id="pwr-bar">
                    <div id="pwr-fill"></div>
                </div>
                <div id="pwr-knob"></div>
            </div>
            <span id="pwr-val">50%</span>
            <button id="btn-shoot">🎱</button>
            <button id="btn-restart" onclick="initGame()">↺ New Game</button>
        </div>
    </div>

    <script>
        const CUE_BALL_PHOTO = null;
        const TABLE_PHOTO = 'P2.jpg';

        const scratchSound = new Audio('reply.mp3');
        scratchSound.preload = 'auto';

        // ── orientation ──────────────────────────────────────────────
        const rotEl = document.getElementById('rotate-overlay');
        function isMobile() {
            const hasTouch = navigator.maxTouchPoints > 0 || /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
            return hasTouch || window.innerWidth <= 1180;
        }
        function checkOri() {
            if (!isMobile()) { rotEl.classList.remove('show'); return; }
            rotEl.classList[window.innerHeight > window.innerWidth ? 'add' : 'remove']('show');
        }
        (async () => {
            try { if (screen.orientation?.lock) await screen.orientation.lock('landscape'); }
            catch (e) { checkOri(); }
        })();
        window.addEventListener('orientationchange', () => setTimeout(checkOri, 200));
        window.addEventListener('resize', () => { checkOri(); resize(); });
        checkOri();

        // ── canvas + DPR fix ──────────────────────────────────────────
        const canvas = document.getElementById('gc');
        const ctx = canvas.getContext('2d');
        // devicePixelRatio برای رندر تیز روی موبایل‌های retina
        const DPR = Math.min(window.devicePixelRatio || 1, 3);
        let W, H, sx, sy;
        const BW = 1000, BH = 500;

        function BR() { return isMobile() ? 20 : 13; }
        function cueW() { return isMobile() ? 9 : 6; }
        function cueLen() { return isMobile() ? 340 : 300; }

        function resize() {
            const wrap = document.getElementById('table-wrap');
            const ww = wrap.clientWidth, wh = wrap.clientHeight;
            const aspect = BW / BH;
            let cw, ch;
            if (ww / wh > aspect) { ch = wh; cw = Math.round(ch * aspect); }
            else { cw = ww; ch = Math.round(cw / aspect); }

            // اندازه CSS = اندازه نمایشی، اما pixel داخلی با DPR ضرب می‌شه
            canvas.style.width = cw + 'px';
            canvas.style.height = ch + 'px';
            canvas.width = Math.round(cw * DPR);
            canvas.height = Math.round(ch * DPR);
            // transform اصلی تنظیم می‌شه تا همه drawها با مقیاس CSS باشن
            ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

            W = cw; H = ch; sx = W / BW; sy = H / BH;
            if (!simRunning) drawScene();
        }

        // ── table geometry ────────────────────────────────────────────
        const RAIL = 38;
        const TW = BW - RAIL * 2, TH = BH - RAIL * 2;
        const TX = RAIL, TY = RAIL;
        const POCKET_R = 28;
        const FRICTION = 0.991, MIN_SPEED = 0.06, SPIN_DECAY = 0.93;

        const POCKETS = [
            { x: TX, y: TY },
            { x: TX + TW / 2, y: TY - 4 },
            { x: TX + TW, y: TY },
            { x: TX, y: TY + TH },
            { x: TX + TW / 2, y: TY + TH + 4 },
            { x: TX + TW, y: TY + TH },
        ];

        const DEFS = [
            { id: 0, label: '', color: '#f5f5f0', stripe: false },
            { id: 1, label: '1', color: '#f5c842', stripe: false },
            { id: 2, label: '2', color: '#1a5fbf', stripe: false },
            { id: 3, label: '3', color: '#d63030', stripe: false },
            { id: 4, label: '4', color: '#7b3fbe', stripe: false },
            { id: 5, label: '5', color: '#e07020', stripe: false },
            { id: 6, label: '6', color: '#1a8f3f', stripe: false },
            { id: 7, label: '7', color: '#8b2222', stripe: false },
            { id: 8, label: '8', color: '#1a1a1a', stripe: false },
            { id: 9, label: '9', color: '#f5c842', stripe: true },
            { id: 10, label: '10', color: '#1a5fbf', stripe: true },
            { id: 11, label: '11', color: '#d63030', stripe: true },
            { id: 12, label: '12', color: '#7b3fbe', stripe: true },
            { id: 13, label: '13', color: '#e07020', stripe: true },
            { id: 14, label: '14', color: '#1a8f3f', stripe: true },
            { id: 15, label: '15', color: '#8b2222', stripe: true },
        ];

        let cueMask = null, tableMask = null;
        function loadCircle(src, sz, cb) {
            const img = new Image(); img.crossOrigin = 'anonymous';
            img.onload = () => {
                const c = document.createElement('canvas'); c.width = c.height = sz;
                const cx = c.getContext('2d');
                cx.beginPath(); cx.arc(sz / 2, sz / 2, sz / 2, 0, Math.PI * 2); cx.clip();
                const r = img.width / img.height; let dw = sz, dh = sz;
                if (r > 1) dw = dh * r; else dh = dw / r;
                cx.drawImage(img, (sz - dw) / 2, (sz - dh) / 2, dw, dh); cb(c);
            };
            img.onerror = () => console.warn('Missing:', src); img.src = src;
        }
        function loadImg(src, cb) {
            const img = new Image(); img.crossOrigin = 'anonymous';
            img.onload = () => cb(img); img.onerror = () => console.warn('Missing:', src); img.src = src;
        }
        if (CUE_BALL_PHOTO) loadCircle(CUE_BALL_PHOTO, 80, c => { cueMask = c; drawScene(); });
        if (TABLE_PHOTO) loadImg(TABLE_PHOTO, img => { tableMask = img; drawScene(); });

        let balls = [], simRunning = false, animFrame;
        let power = 50, aimAngle = Math.PI;
        let turn = 0, scores = [0, 0];
        let msgTimer = null, foulTimer = null;
        let pocketedDuringShot = [];
        let hintShown = true;

        function mkBall(id) { const d = DEFS[id]; return { id: d.id, label: d.label, color: d.color, stripe: d.stripe }; }

        function rackBalls() {
            const br = BR(); balls = [];
            balls.push({ ...mkBall(0), x: TX + TW * .25, y: TY + TH * .5, vx: 0, vy: 0, spin: 0, pocketed: false });
            const rX = TX + TW * .72, rY = TY + TH * .5, d = br * 2.05;
            const rack = [[1], [2, 9], [3, 8, 10], [4, 11, 12, 5], [6, 13, 14, 15, 7]];
            let ids = rack.flat();
            for (let i = ids.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[ids[i], ids[j]] = [ids[j], ids[i]]; }
            let idx = 0;
            rack.forEach((row, ri) => {
                const rowLen = row.length;
                row.forEach((_, ci) => {
                    const def = DEFS[ids[idx++]];
                    balls.push({
                        ...mkBall(def.id),
                        x: rX + ri * d * .866 + (Math.random() - .5) * .3,
                        y: rY + (ci - (rowLen - 1) / 2) * d + (Math.random() - .5) * .3,
                        vx: 0, vy: 0, spin: 0, pocketed: false
                    });
                });
            });
        }
        function cueBall() { return balls.find(b => b.id === 0); }
        function activeBalls() { return balls.filter(b => !b.pocketed); }

        function stepPhysics() {
            const br = BR(), ab = activeBalls();
            ab.forEach(b => {
                b.x += b.vx; b.y += b.vy; b.spin *= SPIN_DECAY;
                b.vx *= FRICTION; b.vy *= FRICTION;
                if (Math.abs(b.vx) < MIN_SPEED * .1) b.vx = 0;
                if (Math.abs(b.vy) < MIN_SPEED * .1) b.vy = 0;
            });
            ab.forEach(b => {
                const mn = TX + br, mx = TX + TW - br, my = TY + br, my2 = TY + TH - br;
                if (b.x < mn) { b.x = mn; b.vx = Math.abs(b.vx) * .88; }
                if (b.x > mx) { b.x = mx; b.vx = -Math.abs(b.vx) * .88; }
                if (b.y < my) { b.y = my; b.vy = Math.abs(b.vy) * .88; }
                if (b.y > my2) { b.y = my2; b.vy = -Math.abs(b.vy) * .88; }
            });
            const minD = br * 2;
            for (let i = 0; i < ab.length; i++) for (let j = i + 1; j < ab.length; j++) {
                const a = ab[i], b = ab[j], dx = b.x - a.x, dy = b.y - a.y, dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < minD && dist > .001) {
                    const nx = dx / dist, ny = dy / dist, ov = (minD - dist) / 2;
                    a.x -= nx * ov; a.y -= ny * ov; b.x += nx * ov; b.y += ny * ov;
                    const dvx = a.vx - b.vx, dvy = a.vy - b.vy, dot = dvx * nx + dvy * ny;
                    if (dot > 0) { const r = .92; a.vx -= dot * nx * r; a.vy -= dot * ny * r; b.vx += dot * nx * r; b.vy += dot * ny * r; }
                }
            }
            let out = [];
            ab.forEach(b => {
                POCKETS.forEach(p => {
                    const dx = b.x - p.x, dy = b.y - p.y;
                    if (Math.sqrt(dx * dx + dy * dy) < POCKET_R * 1.05) { b.pocketed = true; b.vx = 0; b.vy = 0; out.push(b); }
                });
            });
            return out;
        }

        function startSim() {
            simRunning = true; pocketedDuringShot = [];
            setShootBtn(false); runSim();
        }
        function runSim() {
            pocketedDuringShot.push(...stepPhysics());
            const moving = activeBalls().some(b => Math.abs(b.vx) > MIN_SPEED || Math.abs(b.vy) > MIN_SPEED);
            drawScene();
            if (moving) animFrame = requestAnimationFrame(runSim);
            else { simRunning = false; setShootBtn(true); onShotComplete(); }
        }

        function onShotComplete() {
            const cuePocketed = pocketedDuringShot.some(b => b.id === 0);
            const scored = pocketedDuringShot.filter(b => b.id !== 0);
            if (scored.length > 0) scores[turn] += scored.length;
            let sw = true;
            if (cuePocketed) {
                scratchSound.currentTime = 0;
                scratchSound.play().catch(() => { });
                showFoul('⚠ Scratch — Cue ball reset');
                resetCueBall();
                sw = true;
            } else if (scored.length > 0) {
                showMsg(scored.length > 1 ? `${scored.length}× Pocketed! 🎱` : 'Pocketed! 🎱', '');
                sw = false;
            }
            const eight = balls.find(b => b.id === 8);
            if (eight && eight.pocketed) { showMsg(`🏆 Player ${turn + 1} wins!`, ''); setTimeout(() => initGame(), 3200); return; }
            if (activeBalls().filter(b => b.id !== 0).length === 0) { showMsg('🏆 Table cleared!', `P1 ${scores[0]} — P2 ${scores[1]}`); setTimeout(() => initGame(), 3200); return; }
            if (sw) turn = 1 - turn;
            updateHUD(); drawScene();
        }

        function resetCueBall() {
            const cb = cueBall();
            if (cb) { cb.pocketed = false; cb.x = TX + TW * .25; cb.y = TY + TH * .5; cb.vx = 0; cb.vy = 0; }
        }

        function updateHUD() {
            document.getElementById('p1s').textContent = scores[0];
            document.getElementById('p2s').textContent = scores[1];
            document.getElementById('turn-lbl').textContent = `P${turn + 1}`;
            document.getElementById('balls-left').textContent = activeBalls().filter(b => b.id !== 0).length;
            document.getElementById('turn-ring').style.background = turn === 0 ? 'var(--gold)' : '#aaa';
        }

        function setPower(v) {
            power = Math.max(5, Math.min(100, v));
            document.getElementById('pwr-fill').style.width = power + '%';
            document.getElementById('pwr-val').textContent = power + '%';
            document.getElementById('pwr-knob').style.left = power + '%';
            document.getElementById('pwr-mini-fill').style.height = power + '%';
            document.getElementById('pwr-mini-lbl').textContent = Math.round(power) + '%';
        }

        function setShootBtn(on) {
            const b = document.getElementById('btn-shoot');
            on ? b.classList.remove('off') : b.classList.add('off');
        }

        function showMsg(m, s) {
            const em = document.getElementById('msg-main'), es = document.getElementById('msg-sub');
            em.textContent = m; es.textContent = s; em.classList.add('show'); es.classList.add('show');
            clearTimeout(msgTimer);
            msgTimer = setTimeout(() => { em.classList.remove('show'); es.classList.remove('show'); }, 2400);
        }
        function showFoul(t) {
            const el = document.getElementById('foul-badge');
            el.textContent = t; el.classList.add('show');
            clearTimeout(foulTimer);
            foulTimer = setTimeout(() => el.classList.remove('show'), 2200);
        }

        function hRgb(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
        function lighten(h, a) { const [r, g, b] = hRgb(h); return `rgb(${Math.min(255, r + a)},${Math.min(255, g + a)},${Math.min(255, b + a)})`; }
        function darken(h, a) { const [r, g, b] = hRgb(h); return `rgb(${Math.max(0, r - a)},${Math.max(0, g - a)},${Math.max(0, b - a)})`; }

        function drawTable() {
            const rg = ctx.createLinearGradient(0, 0, 0, H);
            rg.addColorStop(0, '#7a4520'); rg.addColorStop(.5, '#5c3317'); rg.addColorStop(1, '#3e2210');
            ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);
            ctx.strokeStyle = 'rgba(255,200,100,0.13)'; ctx.lineWidth = 1;
            const ins = 5 * Math.min(sx, sy); ctx.strokeRect(ins, ins, W - ins * 2, H - ins * 2);
            const fx = TX * sx, fy = TY * sy, fw = TW * sx, fh = TH * sy;
            if (tableMask) {
                ctx.save(); ctx.drawImage(tableMask, fx, fy, fw, fh);
                ctx.fillStyle = 'rgba(0,50,15,0.22)'; ctx.fillRect(fx, fy, fw, fh); ctx.restore();
            } else {
                const fg = ctx.createRadialGradient(fx + fw / 2, fy + fh / 2, 0, fx + fw / 2, fy + fh / 2, Math.max(fw, fh) * .7);
                fg.addColorStop(0, '#1e7a46'); fg.addColorStop(1, '#155535');
                ctx.fillStyle = fg; ctx.fillRect(fx, fy, fw, fh);
                ctx.strokeStyle = 'rgba(255,255,255,.025)'; ctx.lineWidth = 1;
                for (let g = TY; g < TY + TH; g += 13) { ctx.beginPath(); ctx.moveTo(fx, g * sy); ctx.lineTo(fx + fw, g * sy); ctx.stroke(); }
            }
            ctx.strokeStyle = 'rgba(255,255,255,0.1)'; ctx.lineWidth = 1;
            const blx = (TX + TW * .25) * sx;
            ctx.beginPath(); ctx.moveTo(blx, TY * sy); ctx.lineTo(blx, (TY + TH) * sy); ctx.stroke();
            ctx.beginPath(); ctx.arc(blx, (TY + TH / 2) * sy, TH * .18 * sy, -Math.PI / 2, Math.PI / 2); ctx.stroke();
            ctx.fillStyle = 'rgba(255,255,255,.18)';
            ctx.beginPath(); ctx.arc((TX + TW * .72) * sx, (TY + TH / 2) * sy, 3, 0, Math.PI * 2); ctx.fill();
        }

        function drawPockets() {
            const s = Math.min(sx, sy);
            POCKETS.forEach(p => {
                const px = p.x * sx, py = p.y * sy, pr = POCKET_R * s;
                ctx.fillStyle = '#1a0e06'; ctx.beginPath(); ctx.arc(px, py, pr * 1.28, 0, Math.PI * 2); ctx.fill();
                const pg = ctx.createRadialGradient(px, py, 0, px, py, pr);
                pg.addColorStop(0, '#000'); pg.addColorStop(1, '#0d0a06');
                ctx.fillStyle = pg; ctx.beginPath(); ctx.arc(px, py, pr, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = 'rgba(255,180,60,0.22)'; ctx.lineWidth = 1.5;
                ctx.beginPath(); ctx.arc(px, py, pr * 1.1, 0, Math.PI * 2); ctx.stroke();
            });
        }

        function drawBall(b) {
            const br = BR() * Math.min(sx, sy);
            const bx = b.x * sx, by = b.y * sy;

            // سایه
            ctx.save(); ctx.globalAlpha = .3; ctx.fillStyle = '#000';
            ctx.beginPath(); ctx.ellipse(bx + br * .22, by + br * .3, br * .8, br * .42, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();

            ctx.save(); ctx.beginPath(); ctx.arc(bx, by, br, 0, Math.PI * 2); ctx.clip();
            if (b.id === 0 && cueMask) {
                ctx.drawImage(cueMask, bx - br, by - br, br * 2, br * 2);
                ctx.beginPath(); ctx.arc(bx, by, br, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 1.5; ctx.stroke();
            } else if (b.stripe) {
                ctx.fillStyle = '#f5f5f0'; ctx.beginPath(); ctx.arc(bx, by, br, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = b.color; ctx.fillRect(bx - br, by - br * .44, br * 2, br * .88);
            } else {
                const bg = ctx.createRadialGradient(bx - br * .28, by - br * .28, br * .04, bx, by, br);
                bg.addColorStop(0, lighten(b.color, 42)); bg.addColorStop(.6, b.color); bg.addColorStop(1, darken(b.color, 42));
                ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(bx, by, br, 0, Math.PI * 2); ctx.fill();
            }

            if (b.id !== 0) {
                const lbg = b.stripe ? b.color : '#fff', lfg = b.stripe ? '#fff' : '#222', lr = br * .44;
                ctx.fillStyle = lbg; ctx.beginPath(); ctx.arc(bx, by, lr, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = lfg;
                // فونت با اندازه صحیح — Math.round برای وضوح بیشتر
                ctx.font = `bold ${Math.round(Math.max(9, br * .56))}px system-ui`;
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(b.label, bx, by + .5);
            }
            ctx.restore();

            // براق
            ctx.save(); ctx.beginPath(); ctx.arc(bx, by, br, 0, Math.PI * 2); ctx.clip();
            const sg = ctx.createRadialGradient(bx - br * .35, by - br * .35, 0, bx, by, br);
            sg.addColorStop(0, 'rgba(255,255,255,.56)'); sg.addColorStop(.3, 'rgba(255,255,255,.05)'); sg.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(bx, by, br, 0, Math.PI * 2); ctx.fill(); ctx.restore();
        }

        function drawCue() {
            if (simRunning) return;
            const cb = cueBall(); if (!cb || cb.pocketed) return;
            const s = Math.min(sx, sy);
            const br = BR() * s;
            const bx = cb.x * sx, by = cb.y * sy;
            const cl = cueLen() * s, cg = (BR() + 5) * s;
            const ca = aimAngle + Math.PI, cos = Math.cos(ca), sin = Math.sin(ca);
            const x1 = bx + cos * cg, y1 = by + sin * cg;
            const x2 = bx + cos * (cg + cl), y2 = by + sin * (cg + cl);
            const grad = ctx.createLinearGradient(x1, y1, x2, y2);
            grad.addColorStop(0, '#a07828'); grad.addColorStop(.1, '#d4a055');
            grad.addColorStop(.85, '#c8943e'); grad.addColorStop(1, '#8a6020');
            ctx.save();
            ctx.strokeStyle = grad; ctx.lineWidth = Math.max(4, cueW() * s); ctx.lineCap = 'round';
            ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
            ctx.strokeStyle = '#7ecfff'; ctx.lineWidth = Math.max(3, cueW() * s * .7);
            ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x1 + cos * 8 * s, y1 + sin * 8 * s); ctx.stroke();
            ctx.restore();
            const ds = BR() * 2.4 * s;
            const adx = Math.cos(aimAngle), ady = Math.sin(aimAngle);
            ctx.save();
            for (let i = 1; i <= 8; i++) {
                ctx.globalAlpha = .22 - i * .022; ctx.fillStyle = '#f5f5f0';
                ctx.beginPath(); ctx.arc(bx + adx * ds * i, by + ady * ds * i, Math.max(2, 4 * s * (1 - i * .08)), 0, Math.PI * 2); ctx.fill();
            }
            ctx.restore();
            const arcR = (BR() + 14) * s, sweep = (power / 100) * Math.PI * 1.5;
            ctx.save();
            ctx.strokeStyle = power > 70 ? 'rgba(230,57,70,.8)' : power > 40 ? 'rgba(245,200,66,.7)' : 'rgba(125,249,161,.65)';
            ctx.lineWidth = Math.max(2.5, 3.5 * s); ctx.lineCap = 'round';
            ctx.beginPath(); ctx.arc(bx, by, arcR, aimAngle + Math.PI / 2, aimAngle + Math.PI / 2 + sweep); ctx.stroke();
            ctx.restore();
        }

        function drawScene() {
            // کیفیت بالا برای تصاویر
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            drawTable(); drawPockets();
            activeBalls().forEach(b => { if (b.id !== 0) drawBall(b); });
            const cb = cueBall();
            if (cb && !cb.pocketed) { drawCue(); drawBall(cb); }
        }

        // ── touch input ──────────────────────────────────────────────
        let touchStart = null;
        const MAX_SWIPE_DIST = 140;

        function canvasToBase(clientX, clientY) {
            const r = canvas.getBoundingClientRect();
            return { x: (clientX - r.left) / sx, y: (clientY - r.top) / sy };
        }

        canvas.addEventListener('touchstart', e => {
            e.preventDefault();
            if (simRunning) return;
            const cb = cueBall(); if (!cb || cb.pocketed) return;
            const t = e.touches[0];
            touchStart = { x: t.clientX, y: t.clientY };
        }, { passive: false });

        canvas.addEventListener('touchmove', e => {
            e.preventDefault();
            if (simRunning || !touchStart) return;
            const cb = cueBall(); if (!cb || cb.pocketed) return;
            const t = e.touches[0];
            const dx = t.clientX - touchStart.x;
            const dy = t.clientY - touchStart.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const tp = canvasToBase(t.clientX, t.clientY);
            aimAngle = Math.atan2(tp.y - cb.y, tp.x - cb.x);
            const pwr = Math.min(100, Math.round((dist / MAX_SWIPE_DIST) * 100));
            setPower(pwr);
            drawScene();
        }, { passive: false });

        canvas.addEventListener('touchend', e => {
            e.preventDefault();
            if (simRunning || !touchStart) return;
            const cb = cueBall(); if (!cb || cb.pocketed) return;
            const t = e.changedTouches[0];
            const dx = t.clientX - touchStart.x, dy = t.clientY - touchStart.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            touchStart = null;
            if (dist > 8) {
                document.getElementById('swipe-hint').classList.add('gone');
                hintShown = false;
                fireShot();
            }
        }, { passive: false });

        canvas.addEventListener('mousemove', e => {
            if (simRunning) return;
            const cb = cueBall(); if (!cb || cb.pocketed) return;
            const r = canvas.getBoundingClientRect();
            aimAngle = Math.atan2((e.clientY - r.top) / sy - cb.y, (e.clientX - r.left) / sx - cb.x);
            drawScene();
        });
        canvas.addEventListener('click', () => { if (!simRunning) fireShot(); });

        const pwrT = document.getElementById('pwr-track');
        function pfE(e) {
            const r = pwrT.getBoundingClientRect();
            setPower(Math.round(((e.touches ? e.touches[0].clientX : e.clientX) - r.left) / r.width * 100));
        }
        pwrT.addEventListener('mousedown', e => {
            pfE(e);
            const mv = f => pfE(f), up = () => { window.removeEventListener('mousemove', mv); window.removeEventListener('mouseup', up); };
            window.addEventListener('mousemove', mv); window.addEventListener('mouseup', up);
        });
        pwrT.addEventListener('touchstart', e => { e.stopPropagation(); pfE(e); }, { passive: false });
        pwrT.addEventListener('touchmove', e => { e.stopPropagation(); pfE(e); }, { passive: false });

        function fireShot() {
            if (simRunning) return;
            const cb = cueBall(); if (!cb || cb.pocketed) return;
            const spd = (power / 100) * 36;
            cb.vx = Math.cos(aimAngle) * spd; cb.vy = Math.sin(aimAngle) * spd;
            startSim();
        }
        document.getElementById('btn-shoot').addEventListener('click', () => fireShot());
        document.getElementById('btn-shoot').addEventListener('touchstart', e => { e.preventDefault(); e.stopPropagation(); fireShot(); }, { passive: false });

        window.addEventListener('keydown', e => {
            if (e.code === 'Space') { e.preventDefault(); fireShot(); }
            if (e.code === 'ArrowUp' || e.key === '+') setPower(power + 5);
            if (e.code === 'ArrowDown' || e.key === '-') setPower(power - 5);
            if (e.code === 'ArrowLeft') { aimAngle -= 0.05; drawScene(); }
            if (e.code === 'ArrowRight') { aimAngle += 0.05; drawScene(); }
        });

        function initGame() {
            cancelAnimationFrame(animFrame); simRunning = false;
            turn = 0; scores = [0, 0]; aimAngle = Math.PI;
            rackBalls(); setPower(50); updateHUD(); setShootBtn(true); drawScene();
            document.getElementById('msg-main').classList.remove('show');
            document.getElementById('msg-sub').classList.remove('show');
            if (hintShown) document.getElementById('swipe-hint').classList.remove('gone');
        }

        resize();
        initGame();
    </script>
</body>

</html>
